services:

  infopara:
    build: .
    container_name: infopara
    restart: unless-stopped
    # Le prefixe /infopara est retire par Caddy : l'appli recoit des chemins racine.
    # --root-path sert uniquement a generer les bons liens dans les pages.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --root-path /infopara
    environment:
      INFOPARA_DB: /data/veille.db
    volumes:
      - infopara_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: infopara-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - infopara

volumes:
  infopara_data:
  caddy_data:
  caddy_config:
